<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign Up — CA Ranker AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,100..900;1,100..900&family=Sora:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/css/style.css"/>
  <link rel="stylesheet" href="/css/auth.css"/>
</head>
<body class="auth-page">

  <div class="auth-orb auth-orb1"></div>
  <div class="auth-orb auth-orb2"></div>

  <div class="auth-center-wrap">

    <!-- Logo -->
    <a href="/" class="logo auth-top-logo">
      <span class="logo-sq"></span>CA Ranker <em>AI</em>
    </a>

    <!-- Card -->
    <div class="auth-card">
      <div class="auth-header">
        <h1 class="auth-title">Create your account</h1>
        <p class="auth-subtitle">Free forever. No credit card needed.</p>
      </div>

      <div class="auth-banner" id="signupBanner"></div>

      <form class="auth-form" id="signupForm" novalidate>

        <div class="form-group">
          <label class="form-label" for="signupName">Full Name</label>
          <input class="form-input" type="text" id="signupName" placeholder="e.g. Rahul Sharma" autocomplete="name"/>
          <span class="field-err-msg" id="nameErr"></span>
        </div>

        <div class="form-group">
          <label class="form-label" for="signupEmail">Email Address</label>
          <input class="form-input" type="email" id="signupEmail" placeholder="you@example.com" autocomplete="email"/>
          <span class="field-err-msg" id="emailErr"></span>
        </div>

        <div class="form-group">
          <label class="form-label" for="signupPassword">Password</label>
          <div class="input-icon-wrap">
            <input class="form-input" type="password" id="signupPassword" placeholder="Minimum 6 characters" autocomplete="new-password"/>
            <button type="button" class="pw-toggle-btn" id="signupPwToggle" aria-label="Show password">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
          <div class="pw-strength-wrap">
            <div class="pw-strength-bar"><div class="pw-strength-fill" id="pwStrengthFill"></div></div>
            <span class="pw-strength-label" id="pwStrengthLabel"></span>
          </div>
          <span class="field-err-msg" id="passErr"></span>
        </div>

        <div class="form-group">
          <label class="form-label" for="signupAge">Age</label>
          <input class="form-input" type="number" id="signupAge" placeholder="e.g. 22" min="16" max="45"/>
          <span class="field-err-msg" id="ageErr"></span>
        </div>

        <div class="form-group">
          <label class="form-label" for="signupGoal">Your Goal</label>
          <select class="form-select" id="signupGoal">
            <option value="">Select your exam level</option>
            <option value="CA Final">CA Final</option>
            <option value="CA Inter">CA Inter</option>
            <option value="Foundation">Foundation</option>
            <option value="Other">Other</option>
          </select>
          <span class="field-err-msg" id="goalErr"></span>
        </div>

        <button type="submit" id="signupBtn" class="btn-p auth-submit">Create Account →</button>

        <p class="auth-footer-text">
          Already have an account? <a href="/pages/login.html">Log in</a>
        </p>

      </form>
    </div>

  </div>

  <script type="module">
    import { handleSignup, initPasswordStrength, initPasswordToggle } from '/js/auth.js'
    document.getElementById('signupForm').addEventListener('submit', handleSignup)
    initPasswordStrength('signupPassword', 'pwStrengthFill', 'pwStrengthLabel')
    initPasswordToggle('signupPassword', 'signupPwToggle')
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Login — CA Ranker AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,100..900;1,100..900&family=Sora:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/css/style.css"/>
  <link rel="stylesheet" href="/css/auth.css"/>
  <style>
    .admin-login-page { background: #0F0A06; }
    .admin-login-page .auth-orb1 {
      background: radial-gradient(circle, rgba(212,175,55,.18), transparent 70%);
    }
    .admin-login-page .auth-orb2 {
      background: radial-gradient(circle, rgba(200,155,44,.12), transparent 70%);
    }
    .admin-login-page .auth-card {
      background: rgba(20,12,6,.85);
      border: 1px solid rgba(212,175,55,.2);
      box-shadow: 0 0 0 1px rgba(212,175,55,.08), 0 32px 80px rgba(0,0,0,.6);
    }
    .admin-login-page .auth-title { color: #fff; }
    .admin-login-page .auth-subtitle { color: rgba(255,255,255,.45); }
    .admin-login-page .form-label { color: rgba(255,255,255,.4); }
    .admin-login-page .form-input {
      background: rgba(255,255,255,.06);
      border-color: rgba(212,175,55,.2);
      color: #fff;
    }
    .admin-login-page .form-input::placeholder { color: rgba(255,255,255,.2); }
    .admin-login-page .form-input:focus {
      background: rgba(255,255,255,.09);
      border-color: var(--accent);
    }
    .admin-login-page .auth-footer-text { color: rgba(255,255,255,.3); }
    .admin-login-page .auth-footer-text a { color: var(--accent); }
    .admin-badge-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
    }
    .admin-badge-icon {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 18px;
      background: rgba(212,175,55,.1);
      border: 1px solid rgba(212,175,55,.25);
      border-radius: 50px;
      font-size: .72rem;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--accent);
    }
    .admin-lock-icon {
      width: 48px; height: 48px;
      border-radius: 14px;
      background: rgba(212,175,55,.1);
      border: 1px solid rgba(212,175,55,.2);
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 16px;
      color: var(--accent);
    }
    .admin-submit-btn {
      width: 100%;
      justify-content: center;
      background: var(--accent) !important;
      color: var(--primary) !important;
      margin-top: 4px;
    }
    .admin-login-page .auth-banner--error {
      background: rgba(185,28,28,.15);
      border-color: rgba(185,28,28,.3);
      color: #fca5a5;
    }
  </style>
</head>
<body class="auth-page admin-login-page">

  <div class="auth-orb auth-orb1"></div>
  <div class="auth-orb auth-orb2"></div>

  <div class="auth-center-wrap">

    <a href="/" class="logo auth-top-logo" style="color:#fff !important">
      <span class="logo-sq"></span>CA Ranker <em>AI</em>
    </a>

    <div class="auth-card">

      <div class="admin-lock-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      </div>

      <div class="auth-header">
        <h1 class="auth-title">Admin Portal</h1>
        <p class="auth-subtitle">Restricted access. Authorized personnel only.</p>
      </div>

      <div class="admin-badge-wrap">
        <span class="admin-badge-icon">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
          CA Ranker AI Admin
        </span>
      </div>

      <div class="auth-banner" id="adminBanner"></div>

      <form class="auth-form" id="adminForm" novalidate>
        <div class="form-group">
          <label class="form-label">Admin Email</label>
          <input class="form-input" type="email" id="adminEmail" placeholder="admin@caranker.ai" autocomplete="off"/>
        </div>
        <div class="form-group">
          <label class="form-label">Admin Password</label>
          <input class="form-input" type="password" id="adminPassword" placeholder="••••••••" autocomplete="off"/>
        </div>
        <button type="submit" class="btn-p auth-submit admin-submit-btn">
          Access Admin Panel →
        </button>
      </form>

      <p class="auth-footer-text" style="margin-top:20px">
        <a href="/pages/login.html">← Back to Student Login</a>
      </p>

    </div>
  </div>

  <script>
    const ADMIN_EMAIL = 'admin@caranker.ai'
    const ADMIN_PASS  = 'CAranker@Admin2026'

    document.getElementById('adminForm').addEventListener('submit', e => {
      e.preventDefault()
      const email = document.getElementById('adminEmail').value.trim().toLowerCase()
      const pass  = document.getElementById('adminPassword').value
      const btn   = e.target.querySelector('button[type=submit]')

      if (email === ADMIN_EMAIL && pass === ADMIN_PASS) {
        sessionStorage.setItem('caranker_admin', 'true')
        btn.textContent = 'Entering Admin Panel...'
        btn.disabled = true
        setTimeout(() => { window.location.href = '/pages/admin.html' }, 600)
      } else {
        const b = document.getElementById('adminBanner')
        b.textContent = 'Invalid credentials. Access denied.'
        b.className = 'auth-banner auth-banner--error visible'
        // Shake the card
        const card = document.querySelector('.auth-card')
        card.style.animation = 'none'
        card.offsetWidth
        card.style.animation = ''
        card.classList.add('shake')
        setTimeout(() => {
          card.classList.remove('shake')
          b.className = 'auth-banner'
        }, 4000)
      }
    })
  </script>
</body>
</html>
